# Configuração de Deploy Automático no Render (Static Site)
# https://render.com/docs/yaml-spec
services:
  - type: web
    name: socracha
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
